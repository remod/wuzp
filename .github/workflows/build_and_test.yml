name: Build and Test

on: [push]

env:
  SOURCE_DIR: ${{github.workspace}}
  BUILD_DIR: ${{github.workspace}}/build  # Note: Nested environment variables are not supported.
  BUILD_TYPE: Release

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        C_CXX_COMPILER: ["gcc g++", "clang clang++"]
        UNITS_IMPLEMENTATION: [0, 1]
        MATRIX_IMPLEMENTATION: [1]
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
      with:
        node-version: '16'
    - name: Install Dependencies
      run: sudo ${SOURCE_DIR}/scripts/steps/install_dependencies.sh ${{matrix.UNITS_IMPLEMENTATION}} ${{matrix.MATRIX_IMPLEMENTATION}}
    - name: Create Build Environment
      run: ${SOURCE_DIR}/scripts/steps/create_build_environment.sh ${SOURCE_DIR} ${BUILD_DIR} ${{matrix.C_CXX_COMPILER}} ${BUILD_TYPE} ON ON ON ${{matrix.UNITS_IMPLEMENTATION}} ${{matrix.MATRIX_IMPLEMENTATION}}
    - name: Build
      run: ${SOURCE_DIR}/scripts/steps/build.sh ${BUILD_DIR} ${BUILD_TYPE}
    - name: Test
      run: ${SOURCE_DIR}/scripts/steps/test.sh ${SOURCE_DIR} ${BUILD_DIR} ${BUILD_TYPE}
    - name: Format
      shell: bash
      run: ${SOURCE_DIR}/scripts/steps/format.sh ${SOURCE_DIR} ${BUILD_DIR}
    - name: Tidy
      shell: bash
      run: ${SOURCE_DIR}/scripts/steps/tidy.sh ${BUILD_DIR}
    - uses: codecov/codecov-action@v2
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        verbose: true
