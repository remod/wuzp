name: Build and Test

on: [push]

env:  # Note: Nested environment variables are not supported.
  SOURCE_DIR: ${{github.workspace}}
  BUILD_DIR: ${{github.workspace}}/build
  PACKAGE_DIR: ${{github.workspace}}/package_wuzp/wuzp-0.0.1
  BUILD_TYPE: Debug

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        C_CXX_COMPILER: ["gcc g++", "clang clang++"]
        UNITS_IMPLEMENTATION: [0, 1]
        VALUE_MATRIX_IMPLEMENTATION: [1]
    steps:
    - name: Prepare Repository
      uses: actions/checkout@v2
    - name: Install Dependencies
      run: sudo ${SOURCE_DIR}/scripts/steps/install_dependencies.sh ${{matrix.UNITS_IMPLEMENTATION}} ${{matrix.VALUE_MATRIX_IMPLEMENTATION}}
    - name: Create Build Environment
      run: ${SOURCE_DIR}/scripts/steps/create_build_environment.sh ${SOURCE_DIR} ${BUILD_DIR} ${{matrix.C_CXX_COMPILER}} ${BUILD_TYPE} ON ON ON ${{matrix.UNITS_IMPLEMENTATION}} ${{matrix.VALUE_MATRIX_IMPLEMENTATION}}
    - name: Build
      run: ${SOURCE_DIR}/scripts/steps/build.sh ${BUILD_DIR} ${BUILD_TYPE}
    - name: Test
      run: ${SOURCE_DIR}/scripts/steps/test.sh ${SOURCE_DIR} ${BUILD_DIR} ${BUILD_TYPE}
    - name: Format  # TODO(remod): Run this step earlier, potentially in a separate job (it is compiler independent)
      shell: bash
      run: ${SOURCE_DIR}/scripts/steps/format.sh ${SOURCE_DIR} ${BUILD_DIR}
    - name: Tidy
      shell: bash
      run: ${SOURCE_DIR}/scripts/steps/tidy.sh ${BUILD_DIR}
    - name: Package
      shell: bash
      run: ${SOURCE_DIR}/scripts/steps/package.sh ${SOURCE_DIR} ${BUILD_DIR} ${PACKAGE_DIR}
    - name: Upload Code Coverage  # Note: The GitHub action does not find the coverage file, invoke codecov directly.
      shell: bash
      run: |
        sudo apt install curl
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov -t ${{secrets.CODECOV_TOKEN}} -f ${BUILD_DIR}/code_coverage/output.xml
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Repository
        uses: actions/checkout@v2
      - name: Configure GPG Key
        env:
          GPG_SIGNING_KEY: ${{secrets.GPG_SIGNING_KEY}}
        run: |
          echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --import
      - name: Install Dependencies
        run: sudo ${SOURCE_DIR}/scripts/steps/install_dependencies.sh ${{matrix.UNITS_IMPLEMENTATION}} ${{matrix.VALUE_MATRIX_IMPLEMENTATION}}
      - name: Create Build Environment
        run: ${SOURCE_DIR}/scripts/steps/create_build_environment.sh ${SOURCE_DIR} ${BUILD_DIR} true
