name: Build and Test

on: [push]

env:
  WORKSPACE_DIR: ${{github.workspace}}
  BUILD_DIR: ${{github.workspace}}/build  # Note: Nested environment variables are not supported.
  BUILD_TYPE: Release
#  UNITS_IMPLEMENTATION_CTM: 0
#  UNITS_IMPLEMENTATION_BOOST: 1
#  MATRIX_IMPLEMENTATION_CTM: 0
#  MATRIX_IMPLEMENTATION_EIGEN: 1

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        UNITS_IMPLEMENTATION: [0, 1]
        MATRIX_IMPLEMENTATION: [0, 1]
    env:
      UNITS_IMPLEMENTATION: ${{ matrix.UNITS_IMPLEMENTATION }}
      MATRIX_IMPLEMENTATION: ${{ matrix.MATRIX_IMPLEMENTATION }}
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
      with:
        node-version: '16'
#    - name: Source Environment Constants
#      run: source ${WORKSPACE_DIR}/scripts/export_environment_constants.sh
    - name: Test
      run: echo ${UNITS_IMPLEMENTATION_BOOST}
    - name: Install Dependencies
      run: echo ${UNITS_IMPLEMENTATION_BOOST} && sudo ${WORKSPACE_DIR}/scripts/install_dependencies.sh ${{ matrix.UNITS_IMPLEMENTATION }} ${{ matrix.MATRIX_IMPLEMENTATION }}
    - name: Create Build Environment
      run: ${WORKSPACE_DIR}/scripts/create_build_environment.sh ${WORKSPACE_DIR} ${BUILD_DIR} ${BUILD_TYPE} ON ON ON ${UNITS_IMPLEMENTATION} ${MATRIX_IMPLEMENTATION}
    - name: Build
      run: ${WORKSPACE_DIR}/scripts/build.sh ${BUILD_DIR} ${BUILD_TYPE}
    - name: Test
      run: ${WORKSPACE_DIR}/scripts/test.sh ${BUILD_DIR} ${BUILD_TYPE}
    - name: Format
      shell: bash
      run: ${WORKSPACE_DIR}/scripts/format.sh ${BUILD_DIR}
    - name: Tidy
      shell: bash
      run: ${WORKSPACE_DIR}/scripts/tidy.sh ${BUILD_DIR}
