name: CMake

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build_and_test_ctm_units_ctm_matrix:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Install Dependencies
      run: ${{github.workspace}}/scripts/install_depencencies.sh 0 0

    - name: Create Build Environment
      run: ${{github.workspace}}/scripts/create_build_environment.sh ${{github.workspace}}/build $BUILD_TYPE ON ON ON 0 0

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Execute tests defined by the CMake configuration.
      # If they fail, rerun the failed tests in verbose mode.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C $BUILD_TYPE || ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

    - name: Format
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: make format && git diff --exit-code ${{github.workspace}}

    - name: Tidy
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: make tidy

  build_and_test_boost_units_ctm_matrix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Update Package Index
        run: sudo apt update

      - name: Install Dependencies
        run: sudo apt install git cmake libboost-dev libgtest-dev clang-format clang-tidy

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_TESTS=ON -DENABLE_FORMAT=ON -DENABLE_TIDY=ON -DUNITS_IMPLEMENTATION=1 -DMATRIX_IMPLEMENTATION=0

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ctest -C $BUILD_TYPE || ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

      - name: Format
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: make format && git diff --exit-code ${{github.workspace}}

      - name: Tidy
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: make tidy

  build_and_test_ctm_units_eigen_matrix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Update Package Index
        run: sudo apt update

      - name: Install Dependencies
        run: sudo apt install git cmake libeigen3-dev libgtest-dev clang-format clang-tidy

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_TESTS=ON -DENABLE_FORMAT=ON -DENABLE_TIDY=ON -DUNITS_IMPLEMENTATION=0 -DMATRIX_IMPLEMENTATION=1

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ctest -C $BUILD_TYPE || ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

      - name: Format
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: make format && git diff --exit-code ${{github.workspace}}

      - name: Tidy
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: make tidy

  build_and_test_boost_units_eigen_matrix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Update Package Index
        run: sudo apt update

      - name: Install Dependencies
        run: sudo apt install git cmake libboost-dev libeigen3-dev libgtest-dev clang-format clang-tidy

      - name: Create Build Environment
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_TESTS=ON -DENABLE_FORMAT=ON -DENABLE_TIDY=ON -DUNITS_IMPLEMENTATION=1 -DMATRIX_IMPLEMENTATION=1

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: ctest -C $BUILD_TYPE || ctest -C $BUILD_TYPE --rerun-failed --output-on-failure

      - name: Format
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: make format && git diff --exit-code ${{github.workspace}}

      - name: Tidy
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: make tidy
