name: CI/CD

on: [push]

env:  # Note: Nested environment variables are not supported.
  REPO_DIR: ${{github.workspace}}
  BUILD_DIR: ${{github.workspace}}/build
  PACKAGE_DIR: ${{github.workspace}}/package_wuzp/wuzp-0.0.1
  BUILD_TYPE: Debug

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        C_CXX_COMPILER: ["gcc g++", "clang clang++"]
        UNITS_IMPLEMENTATION: [0, 1]
        VALUE_MATRIX_IMPLEMENTATION: [1]
    steps:
    - name: Prepare Repository
      uses: actions/checkout@v2
    - name: Install Dependencies
      run: sudo ${REPO_DIR}/scripts/build_and_test/steps/install_dependencies.sh ${{matrix.UNITS_IMPLEMENTATION}} ${{matrix.VALUE_MATRIX_IMPLEMENTATION}}
    - name: Create Build Environment
      run: ${REPO_DIR}/scripts/build_and_test/steps/create_build_environment.sh ${REPO_DIR} ${BUILD_DIR} ${{matrix.C_CXX_COMPILER}} ${BUILD_TYPE} ON ON ON ${{matrix.UNITS_IMPLEMENTATION}} ${{matrix.VALUE_MATRIX_IMPLEMENTATION}}
    - name: Build
      run: ${REPO_DIR}/scripts/build_and_test/steps/build.sh ${BUILD_DIR} ${BUILD_TYPE}
    - name: Test
      run: ${REPO_DIR}/scripts/build_and_test/steps/test.sh ${REPO_DIR} ${BUILD_DIR} ${BUILD_TYPE}
    - name: Format  # TODO(remod): Run this step earlier, potentially in a separate job (it is compiler independent)
      shell: bash
      run: ${REPO_DIR}/scripts/build_and_test/steps/format.sh ${REPO_DIR} ${BUILD_DIR}
    - name: Tidy
      shell: bash
      run: ${REPO_DIR}/scripts/build_and_test/steps/tidy.sh ${BUILD_DIR}
    - name: Upload Code Coverage  # Note: The GitHub action does not find the coverage file, invoke codecov directly.
      shell: bash
      run: |
        sudo apt install curl
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov -t ${{secrets.CODECOV_TOKEN}} -f ${BUILD_DIR}/code_coverage/output.xml
  deliver:
#    needs: build_and_test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        TARGET_NAME: ["wuzp"]
    env:
      DRY_RUN: ${{github.ref_name!='master'}}
      TARGET_NAME: ${{matrix.TARGET_NAME}}
      SOURCE_DIR: ${{github.workspace}}/${{matrix.TARGET_NAME}}
    steps:
      - name: Prepare Repository
        uses: actions/checkout@v2
      - name: Parse Package Version
        run: | 
          source ${REPO_DIR}/scripts/deliver/steps/parse_package_version.sh ${SOURCE_DIR}
          echo "GH_TARGET_VERSION=${TARGET_VERSION}" >> $GITHUB_ENV
          echo "GH_BUILD_INCREMENT=${BUILD_INCREMENT}" >> $GITHUB_ENV
      - name: Install Dependencies
        run: sudo ${REPO_DIR}/scripts/deliver/steps/install_dependencies.sh
      - name: Configure GPG Key
        env:
          GPG_SIGNING_KEY: ${{secrets.GPG_SIGNING_KEY}}
        run: source ${REPO_DIR}/scripts/deliver/steps/configure_gpg_key.sh
      - name: Package
        env:
          TARGET_VERSION: ${{env.GH_TARGET_VERSION}}
        run: ${REPO_DIR}/scripts/deliver/steps/package.sh ${SOURCE_DIR} ${PACKAGE_DIR} ${TARGET_NAME} ${TARGET_VERSION}
      - name: Deliver
        env:
          TARGET_VERSION: ${{env.GH_TARGET_VERSION}}
          BUILD_INCREMENT: ${{env.GH_BUILD_INCREMENT}}
        run: ${REPO_DIR}/scripts/deliver/steps/deliver.sh ${PACKAGE_DIR} ${TARGET_NAME} ${TARGET_VERSION} ${BUILD_INCREMENT} ${DRY_RUN}
