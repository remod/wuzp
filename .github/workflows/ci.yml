name: Continuous Integration

on: [push]

env:  # Note: Nested environment variables are not supported.
  DEBIAN_FRONTEND: noninteractive
  REPO_DIR: ${{github.workspace}}

jobs:
  check_format:
    runs-on: ubuntu-20.04
    env:
      BUILD_DIR: ${{github.workspace}}/tmp/wuzp/check_format
      BUILD_TYPE: Debug
      C_CXX_COMPILER: "gcc g++"
      SOURCE_DIR: ${{github.workspace}}/tests
      UNITS_IMPLEMENTATION: 0
      VALUE_MATRIX_IMPLEMENTATION: 0
    steps:
      - name: Prepare Repository
        uses: actions/checkout@v2
      - name: Upgrade
        run: sudo ${REPO_DIR}/scripts/common_steps/upgrade.sh
      - name: Install Dependencies
        run: sudo ${REPO_DIR}/scripts/check_format/steps/install_dependencies.sh
      - name: Create Build Environment
        run: ${REPO_DIR}/scripts/common_steps/create_build_environment.sh ${SOURCE_DIR} ${BUILD_DIR} ON ${C_CXX_COMPILER} ${BUILD_TYPE} OFF ON OFF ${UNITS_IMPLEMENTATION} ${VALUE_MATRIX_IMPLEMENTATION}
      - name: Check Format
        run: ${REPO_DIR}/scripts/common_steps/check_format.sh ${REPO_DIR} ${BUILD_DIR}
  test:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        C_CXX_COMPILER: ["gcc g++", "clang clang++"]
        UNITS_IMPLEMENTATION: [0, 1]
        VALUE_MATRIX_IMPLEMENTATION: [1]
    env:
      BUILD_DIR: ${{github.workspace}}/tmp/wuzp/test
      BUILD_TYPE: Debug
      C_CXX_COMPILER: ${{matrix.C_CXX_COMPILER}}
      SOURCE_DIR: ${{github.workspace}}/tests
      UNITS_IMPLEMENTATION: ${{matrix.UNITS_IMPLEMENTATION}}
      VALUE_MATRIX_IMPLEMENTATION: ${{matrix.VALUE_MATRIX_IMPLEMENTATION}}
    steps:
    - name: Prepare Repository
      uses: actions/checkout@v2
    - name: Upgrade
      run: sudo ${REPO_DIR}/scripts/common_steps/upgrade.sh
    - name: Install Dependencies
      run: sudo ${REPO_DIR}/scripts/test/steps/install_dependencies.sh ${UNITS_IMPLEMENTATION} ${VALUE_MATRIX_IMPLEMENTATION}
    - name: Create Build Environment
      run: ${REPO_DIR}/scripts/common_steps/create_build_environment.sh ${SOURCE_DIR} ${BUILD_DIR} ON ${C_CXX_COMPILER} ${BUILD_TYPE} ON OFF ON ${UNITS_IMPLEMENTATION} ${VALUE_MATRIX_IMPLEMENTATION}
    - name: Build
      run: ${REPO_DIR}/scripts/common_steps/build.sh ${BUILD_DIR} ${BUILD_TYPE}
    - name: Test
      run: ${REPO_DIR}/scripts/common_steps/test.sh ${BUILD_DIR} ${BUILD_TYPE}
    - name: Generate Coverage Reports
      run: ${REPO_DIR}/scripts/common_steps/generate_coverage_reports.sh ${REPO_DIR} ${BUILD_DIR}
    - name: Tidy
      run: ${REPO_DIR}/scripts/common_steps/tidy.sh ${BUILD_DIR}
    - name: Upload Code Coverage  # Note: The GitHub action does not find the coverage file, invoke codecov directly.
      run: |
        sudo apt install curl
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov -t ${{secrets.CODECOV_TOKEN}} -f ${BUILD_DIR}/code_coverage/output.xml
  package:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        PACKAGE_NAME: ["wuzp", "wuzp_boost", "wuzp_eigen"]
    env:
      PACKAGE_DIR: ${{github.workspace}}/tmp/wuzp/package/${{matrix.PACKAGE_NAME}}
      PACKAGE_NAME: ${{matrix.PACKAGE_NAME}}
      SOURCE_DIR: ${{github.workspace}}/${{matrix.PACKAGE_NAME}}
    steps:
      - name: Prepare Repository
        uses: actions/checkout@v2
      - name: Parse Package Version
        run: |
          source ${REPO_DIR}/scripts/common_steps/parse_package_version.sh ${SOURCE_DIR}
          echo "GH_PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV
      - name: Upgrade
        run: sudo ${REPO_DIR}/scripts/common_steps/upgrade.sh
      - name: Install Dependencies
        run: sudo ${REPO_DIR}/scripts/package/steps/install_dependencies.sh
      - name: Configure GPG Key
        env:
          GPG_SIGNING_KEY: ${{secrets.GPG_SIGNING_KEY}}
        run: |
          source ${REPO_DIR}/scripts/common_steps/configure_gpg_key.sh
          echo "GH_GNUPGHOME=${GNUPGHOME}" >> $GITHUB_ENV
      - name: Package
        env:
          GNUPGHOME: ${{env.GH_GNUPGHOME}}
          GPG_SIGNING_KEYGRIP: ${{secrets.GPG_SIGNING_KEYGRIP}}
          GPG_SIGNING_KEY_PASSPHRASE: ${{secrets.GPG_SIGNING_KEY_PASSPHRASE}}
          PACKAGE_VERSION: ${{env.GH_PACKAGE_VERSION}}
        run: ${REPO_DIR}/scripts/common_steps/package.sh ${SOURCE_DIR} ${PACKAGE_DIR} ${PACKAGE_NAME} ${PACKAGE_VERSION}
      - name: Upload Package to Cache
        uses: actions/cache@v2
        with:
          # Note: It is not possible to reuse environment variables here.
          key: ${{matrix.PACKAGE_NAME}}_${{github.run_id}}
          path: ${{github.workspace}}/tmp/wuzp/package/${{matrix.PACKAGE_NAME}}
  test_packages:
    needs: package
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        C_CXX_COMPILER: ["gcc g++", "clang clang++"]
        UNITS_IMPLEMENTATION: [0, 1]
        VALUE_MATRIX_IMPLEMENTATION: [1]
    env:
      BUILD_DIR: ${{github.workspace}}/tmp/wuzp/test_packages
      BUILD_TYPE: Debug
      C_CXX_COMPILER: ${{matrix.C_CXX_COMPILER}}
      PACKAGES_DIR: ${{github.workspace}}/tmp/wuzp/package
      SOURCE_DIR: ${{github.workspace}}/tests
      UNITS_IMPLEMENTATION: ${{matrix.UNITS_IMPLEMENTATION}}
      VALUE_MATRIX_IMPLEMENTATION: ${{matrix.VALUE_MATRIX_IMPLEMENTATION}}
    steps:
      - name: Prepare Repository
        uses: actions/checkout@v2
      - name: Download Package wuzp from Cache
        uses: actions/cache@v2
        with:
          # Note: It is not possible to reuse environment variables here.
          key: wuzp_${{github.run_id}}
          path: ${{github.workspace}}/tmp/wuzp/package/wuzp
      - name: Download Package wuzp_boost from Cache
        uses: actions/cache@v2
        with:
          # Note: It is not possible to reuse environment variables here.
          key: wuzp_boost_${{github.run_id}}
          path: ${{github.workspace}}/tmp/wuzp/package/wuzp_boost
      - name: Download Package wuzp_eigen from Cache
        uses: actions/cache@v2
        with:
          # Note: It is not possible to reuse environment variables here.
          key: wuzp_eigen_${{github.run_id}}
          path: ${{github.workspace}}/tmp/wuzp/package/wuzp_eigen
      - name: Upgrade
        run: sudo ${REPO_DIR}/scripts/common_steps/upgrade.sh
      - name: Install Dependencies
        run: sudo ${REPO_DIR}/scripts/test_packages/steps/install_dependencies.sh ${UNITS_IMPLEMENTATION} ${VALUE_MATRIX_IMPLEMENTATION}
      - name: Install Packages
        run: sudo ${REPO_DIR}/scripts/test_packages/steps/install_packages.sh ${PACKAGES_DIR} ${UNITS_IMPLEMENTATION} ${VALUE_MATRIX_IMPLEMENTATION}
      - name: Create Build Environment
        run: ${REPO_DIR}/scripts/common_steps/create_build_environment.sh ${SOURCE_DIR} ${BUILD_DIR} OFF ${C_CXX_COMPILER} ${BUILD_TYPE} ON OFF OFF ${UNITS_IMPLEMENTATION} ${VALUE_MATRIX_IMPLEMENTATION}
      - name: Build
        run: ${REPO_DIR}/scripts/common_steps/build.sh ${BUILD_DIR} ${BUILD_TYPE}
      - name: Test
        run: ${REPO_DIR}/scripts/common_steps/test.sh ${BUILD_DIR} ${BUILD_TYPE}
  deliver:
    needs: [check_format, test, test_packages]
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        PACKAGE_NAME: ["wuzp", "wuzp_boost", "wuzp_eigen"]
    env:
      DRY_RUN: ${{github.ref_name!='master'}}
      PACKAGE_DIR: ${{github.workspace}}/tmp/wuzp/package/${{matrix.PACKAGE_NAME}}
      PACKAGE_NAME: ${{matrix.PACKAGE_NAME}}
      SOURCE_DIR: ${{github.workspace}}/${{matrix.PACKAGE_NAME}}
    steps:
      - name: Prepare Repository
        uses: actions/checkout@v2
      - name: Download Package from Cache
        uses: actions/cache@v2
        with:
          # Note: It is not possible to reuse environment variables here.
          key: ${{matrix.PACKAGE_NAME}}_${{github.run_id}}
          path: ${{github.workspace}}/tmp/wuzp/package/${{matrix.PACKAGE_NAME}}
      - name: Parse Package Version
        run: | 
          source ${REPO_DIR}/scripts/common_steps/parse_package_version.sh ${SOURCE_DIR}
          echo "GH_PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV
      - name: Upgrade
        run: sudo ${REPO_DIR}/scripts/common_steps/upgrade.sh
      - name: Install Dependencies
        run: sudo ${REPO_DIR}/scripts/deliver/steps/install_dependencies.sh
      - name: Configure GPG Key
        env:
          GPG_SIGNING_KEY: ${{secrets.GPG_SIGNING_KEY}}
        run: |
          source ${REPO_DIR}/scripts/common_steps/configure_gpg_key.sh
          echo "GH_GNUPGHOME=${GNUPGHOME}" >> $GITHUB_ENV
      - name: Deliver
        env:
          GNUPGHOME: ${{env.GH_GNUPGHOME}}
          PACKAGE_VERSION: ${{env.GH_PACKAGE_VERSION}}
        run: ${REPO_DIR}/scripts/common_steps/deliver.sh ${PACKAGE_DIR} ${PACKAGE_NAME} ${PACKAGE_VERSION} ${DRY_RUN}
