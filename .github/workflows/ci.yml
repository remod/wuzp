name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Run the macOS and Windows jobs, which are skipped while the repository is private
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

# All jobs call the scripts in ci/. The Linux jobs run in the dev container images (.devcontainer/Dockerfile), so that
# ci/local.sh can run exactly the same jobs locally.
jobs:
  image:
    name: dev container images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      min: ${{ steps.publish.outputs.min }}
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the images if the Dockerfile or its build arguments changed
        id: publish
        run: |
          for VARIANT in min latest; do
            echo "${VARIANT}=$(ci/image.sh publish ${VARIANT})" >> "${GITHUB_OUTPUT}"
          done

  format:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/check_format.sh

  tidy:
    name: tidy (${{ matrix.units }} units, ${{ matrix.values }} values)
    needs: image
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        units: [wuzp, boost, mp_units]
        values: [eigen, blitz]
        include:
          # The archetypes of the tests (see the test job).
          - units: archetype
            values: archetype
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/tidy.sh clang-${{ matrix.units }}-${{ matrix.values }}

  test:
    name: test (${{ matrix.variant }}, ${{ matrix.compiler }}, ${{ matrix.units }} units, ${{ matrix.values }} values)
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs[matrix.variant] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # min: the oldest supported dependency versions (Ubuntu 22.04), latest: the newest (Ubuntu 26.04).
        variant: [min, latest]
        compiler: [gcc, clang]
        # Every backend combination is tested to prove that wuzp generalizes across implementations.
        units: [wuzp, boost, mp_units]
        values: [eigen, blitz]
        exclude:
          # mp-units needs GCC 12 or Clang 16, newer than those of the min variant.
          - variant: min
            units: mp_units
        include:
          # The archetypes: minimal backends in the tests, which provide exactly what the concepts of the backend interface
          # require, so the tests pass with them only if wuzp uses nothing beyond the interface.
          - variant: latest
            compiler: gcc
            units: archetype
            values: archetype
          - variant: latest
            compiler: clang
            units: archetype
            values: archetype
    steps:
      - uses: actions/checkout@v7
      - run: ci/test.sh ${{ matrix.compiler }}-${{ matrix.units }}-${{ matrix.values }}

  # The test presets build in debug mode. This job tests one backend combination in release mode, i.e. with NDEBUG defined,
  # without the checks that only run in debug builds and with the warnings that only the optimizer finds.
  test-release:
    name: test (latest, gcc, wuzp units, eigen values, release)
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/test.sh gcc-wuzp-eigen-release

  coverage:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/coverage.sh
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  sanitizers:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/sanitizers.sh

  install:
    name: install and consume
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: ci/install_and_consume.sh

  benchmarks:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Only checks that the benchmarks build and run: the times on shared runners are too noisy to compare.
      - run: ci/benchmarks.sh --benchmark_min_time=0.01s

  # macOS is fully supported, with Apple Clang and the Homebrew packages: every backend combination except mp-units, since
  # Apple Clang 17 has a compiler bug that mp-units cannot work around.
  # The macOS and Windows jobs only run by themselves once the repository is public: for private repositories, GitHub
  # bills their minutes at 10 and 2 times the Linux rate. Run the workflow manually with "platforms" to test them before.
  macos:
    name: macos (${{ matrix.units }} units, ${{ matrix.values }} values)
    if: ${{ !github.event.repository.private || inputs.platforms }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        units: [wuzp, boost]
        values: [eigen, blitz]
    steps:
      - uses: actions/checkout@v7
      - run: brew install blitz boost eigen googletest ninja
      - run: ci/test.sh clang-${{ matrix.units }}-${{ matrix.values }}

  # MSVC is supported on a best-effort basis, with the vcpkg packages. mp-units is not tested here: its MSVC support is
  # limited (see its compiler support documentation).
  windows:
    name: windows (${{ matrix.units }} units, ${{ matrix.values }} values)
    if: ${{ !github.event.repository.private || inputs.platforms }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        units: [wuzp, boost]
        values: [eigen, blitz]
    env:
      # The CI scripts count the cores with getconf, which Git Bash on Windows may not have. The runners have 4 cores.
      WUZP_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - run: vcpkg install --triplet x64-windows blitz boost-units eigen3 gtest
      - run: |
          TOOLCHAIN_FILE="$(cygpath --mixed "${VCPKG_INSTALLATION_ROOT}")/scripts/buildsystems/vcpkg.cmake"
          ci/test.sh msvc-${{ matrix.units }}-${{ matrix.values }} -D CMAKE_TOOLCHAIN_FILE="${TOOLCHAIN_FILE}"
