name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

# All jobs run in the dev container images (.devcontainer/Dockerfile) and call the scripts in ci/, so that
# ci/local.sh can run exactly the same jobs locally.
jobs:
  image:
    name: dev container images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      min: ${{ steps.publish.outputs.min }}
      latest: ${{ steps.publish.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the images if the Dockerfile or its build arguments changed
        id: publish
        run: |
          for VARIANT in min latest; do
            echo "${VARIANT}=$(ci/image.sh publish ${VARIANT})" >> "${GITHUB_OUTPUT}"
          done

  format:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: ci/check_format.sh

  test:
    name: test (${{ matrix.variant }}, ${{ matrix.compiler }}, ${{ matrix.units }} units, ${{ matrix.values }} values)
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs[matrix.variant] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        # min: the oldest supported dependency versions (Ubuntu 22.04), latest: the newest (Ubuntu 26.04).
        variant: [min, latest]
        compiler: [gcc, clang]
        # Every backend combination is tested to prove that wuzp generalizes across implementations.
        units: [wuzp, boost]
        values: [eigen, blitz]
    steps:
      - uses: actions/checkout@v4
      - run: ci/test.sh ${{ matrix.compiler }}-${{ matrix.units }}-${{ matrix.values }}

  coverage:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: ci/coverage.sh
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  sanitizers:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: ci/sanitizers.sh

  install:
    name: install and consume
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.latest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: ci/install_and_consume.sh
